<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BENT TOY RACK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Permanent+Marker&family=Share+Tech+Mono&display=swap" />
  </head>
  <body>
    <div id="topbar">
      <span class="app">BENT TOY RACK</span>
      <div id="tabs"></div>
      <span class="spacer"></span>
      <a class="bar-btn manual" href="manual/index.html" title="使い方を全部まとめた攻略本">📖 攻略本</a>
      <a class="bar-btn" id="studioBtn" href="studio.html" title="2 台を並べて曲を作るスタジオ">STUDIO</a>
      <a class="bar-btn" href="sampler.html" title="音を食べるサンプラー PAKU-PAKU 16（スマホ・タブレットでも）">SAMPLER</a>
      <button class="bar-btn" id="seqBtn" title="シーケンサー（録音・編集）を開く">☰ SEQ</button>
      <button class="bar-btn rec" id="recBtn" title="全部のおもちゃの音を録音"><span class="led"></span>REC <span class="rec-time" id="recTime">--:--</span></button>
      <button class="bar-btn" id="midiBtn" title="MIDI 機器を使う"><span class="led green"></span>MIDI <span class="midi-name" id="midiName"></span></button>
      <button class="bar-btn" id="helpBtn" title="キー操作">?</button>
    </div>
    <div id="stage"></div>
    <div id="help" hidden></div>
    <div id="arr-wrap" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
