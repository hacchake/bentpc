ommended seeds`,"このシードを聞いてみろ！":`Listen to these seeds!`,"裏技・隠し要素":`Tricks and secrets`,"知ってると自慢できる！":`Things to brag about!`,"困ったときは（Q&A）":`Troubleshooting (Q&A)`,"困ったときは（Q&amp;A）":`Troubleshooting (Q&amp;A)`,あわてずに読もう:`Don't panic, read this`,用語集:`Glossary`,"むずかしい言葉を 1 行で":`Hard words in one line`,権利に関する注意:`About rights`,とても大事なことです:`This is very important`,改造おじさん:`Uncle Mod`,"ここがポイント！":`Key point!`,"注意！":`Careful!`,"ここは、ガラクタ市で拾ってきた子供向けのおもちゃ楽器を、とことん改造した「魔改造おもちゃ」が並ぶラックだ！":`This is a rack of children's toy instruments picked up at a junk market and modded to the extreme: circuit-bent toys!`,"おもちゃの中の回路を、わざとつなぎ変えたり、ボタンやツマミを後から付け足したりして、作った人が思ってもみなかった音を出す遊びを":`Deliberately rewiring a toy's circuits and adding buttons and knobs to get sounds its makers never imagined is called`,サーキットベンディング:`circuit bending`,"という。 このアプリは、その魔改造おもちゃを 7 台（サンプラー入り）、パソコンの中にまるごと作ったものだ。本物と違って、どれだけいじっても壊れないし、感電もしない！":`. This app builds 7 of those modded toys (sampler included) entirely inside your computer. Unlike the real thing, you can't break them and you can't get a shock!`,"どれも「読み上げがまちがう」「電気が足りなくてよれる」「エンジンで音階を弾く」みたいに、ちゃんと壊れ方にクセがあるんだ。1 台ずつ、クセをつかむのがうまくなる近道だぞ！":`Each one breaks in its own way: "reads words wrong", "wobbles from too little power", "plays scales with an engine"... Learning each toy's quirks one at a time is the fastest way to get good!`,"全部のおもちゃは、上のタブ（1〜7）で切り替える。裏にいるおもちゃも鳴り続けるので、重ねて演奏できる。":`Switch toys with the tabs at the top (1–7). Hidden toys keep playing, so you can layer them.`,"では好きなおもちゃを並べて、いっしょに曲を作れる。":`lets you line up your favourite toys and make songs together.`,最初の案内:`First-time guide`,"初めて開くと、画面が暗くなって POWER ボタンだけが光る。「電源を入れてね」の矢印の先を押そう！":`The first time you open it, the screen dims and only the POWER button glows. Press where the "Turn the power on" arrow points!`,"POWER の場所":`Where POWER is`,"電源 OFF の間は、POWER の横の LED がゆっくり点滅して「ここを押して」と教えてくれる。":`While off, the LED next to POWER blinks slowly to say "press here".`,"キーボードの Enter":`Enter on the keyboard`,"でも電源が入る（電源 OFF のとき）。":`also switches it on (when off).`,"電源 OFF のままキーやツマミを触ると、POWER ボタンがピカッと光る。":`Touch keys or knobs while off and the POWER button flashes.`,"ブラウザは「最初に操作するまで音を出さない」決まりがあるけど、電源を入れる操作で音の準備も済む。":`Browsers won't play sound until you interact with the page, but switching on also gets the sound ready.`,電源を入れる:`Switch on`,"：1. BLIPPY なら「HELLO」としゃべる。":`: 1. BLIPPY says "HELLO".`,好きなキーを弾く:`Play any key`,"：PC キーボードの A〜Z がそのまま鳴る。":`: A–Z on your PC keyboard play directly.`,グリッチを押しながら弾く:`Play while holding a glitch`,"：トイPC なら , . / ; : キーが GLITCH 1〜5。押している間だけ壊れる！":`: on the toy PC the , . / ; : keys are GLITCH 1–5. It breaks only while held!`,"：右の緑の基板の赤いボタンを押すと、そのおもちゃの曲ができて鳴り出す。":`: press the red button on the green board to the right and a song for that toy is written and starts playing.`,"ヘルプ（右上の ?）の中の「電源の案内をもう一度見る」で、最初の案内をまた見られるぞ。":`In the help (? at the top right), "Show the power guide again" brings back the first-time guide.`,"トイPC（BLIPPY BOOK 30）は、MODE によって同じキーから出る音が変わる。全部のキーの一覧だ！":`On the toy PC (BLIPPY BOOK 30) the same key makes a different sound in each MODE. Here is every key!`,"音が出ない「死にキー」は…":`Dead keys that make no sound…`,"ありません！":`There are none!`,"このトイPC は全部のキーで必ず何か鳴るように作ってある。QUIZ モードで違う文字を押しても「NO!」「TRY AGAIN」としゃべる。":`Every key on this toy PC always makes a sound. Even a wrong letter in QUIZ mode says "NO!" or "TRY AGAIN".`,キー:`Key`,"メロディ {0}":`Melody {0}`,"答え {0}":`Answer {0}`,"♪ MUSIC（そのモードのメロディ）":`♪ MUSIC (the mode's melody)`,"? 決まり文句をしゃべる":`? Says a catchphrase`,"★ 効果音":`★ Sound effect`,"OK「GOOD JOB」":`OK "GOOD JOB"`,"和音 {0}":`Chord {0}`,"BEAT {0}（1 小節のリズム）":`BEAT {0} (a 1-bar rhythm)`,問題をもう一度:`Repeat the question`,次の問題:`Next question`,"ヒント（答えの文字）":`Hint (the answer letter)`,"「GOOD JOB」":`"GOOD JOB"`,"どのモードでも、ドレミの音（{0}）":`In every mode: do-re-mi notes ({0})`,"QUIZ モード：液晶のキャラの文字を押すと「RIGHT!」→ 次の問題。違う文字だと「NO!」か「TRY AGAIN」。TUNE モードの「メロディ」は文字ごとに違う短い曲。":`QUIZ mode: press the letter of the character on screen for "RIGHT!" → next question. A wrong letter gives "NO!" or "TRY AGAIN". In TUNE mode each letter's "melody" is a different short tune.`,"1 音ずつしか鳴らない。新しいキーを押すと、前の音は止まる（本物のおもちゃと同じ）。長い「K IS FOR KING」の途中で別のキーを押すと切れてしまうぞ。":`Only one sound at a time. A new key stops the previous sound (just like the real toy). Press another key halfway through a long "K IS FOR KING" and it gets cut off.`,"トイPC：GLITCH 1〜5 × BASE 1〜5 ＝ 25 種":`Toy PC: GLITCH 1–5 × BASE 1–5 = 25 kinds`,"押している間だけ効く。いくつ同時に押してもいい（重ねがけ）。凶暴度は、音の壊れ方の激しさのめやすだ。":`They work only while held. Press as many as you like at once (they stack). Ferocity shows how violently the sound breaks.`,ボタン:`Button`,名前:`Name`,"何が起きる？":`What happens?`,凶暴度:`Ferocity`,"TELEKEY：GLITCH ボタン（F1〜F5）× BASE（F6〜F10）＝ 25 種の一発グリッチ":`TELEKEY: GLITCH buttons (F1–F5) × BASE (F6–F10) = 25 one-shot glitches`,"押すと 1 秒前後（表の「長さ」）、映像と音がいっしょに派手に壊れる「一発技」だ。":`One press wrecks the picture and the sound together for about a second (see "Length"). A one-shot move.`,"かかるグリッチ：{0}":`Glitches applied: {0}`,"{0} 秒":`{0} s`,"このアプリのおもちゃは、弾いているだけで勝手に固まることは":`The toys in this app`,ない:`never`,"。そのかわり「熱（ストレス）」がある！":`freeze just because you play them. Instead, there is "heat (stress)"!`,"熱のしくみ（トイPC・TELEKEY）":`How heat works (toy PC, TELEKEY)`,熱が上がる:`Heat rises`,"GLITCH ボタンを押し続けるほど（2 個・3 個と増やすとぐんと速い）。BASE が高いほど、DIST・LOOP・STRETCH 中ほど、グリッチ中にキーを連打するほど":`The longer you hold GLITCH buttons (much faster with 2 or 3). Higher BASE, with DIST / LOOP / STRETCH on, or hammering keys during glitches`,"効いているグリッチキーが多いほど。一発グリッチ・連打・FEEDBACK / DIST / GLITCH AMT の振り切り・CROSSTALK でも上がる":`The more glitch keys are active. One-shot glitches, hammering keys, maxed FEEDBACK / DIST / GLITCH AMT and CROSSTALK raise it too`,暴発:`Runaway`,"熱が 40% をこえると、押していないグリッチが 20〜150ms 勝手に入る":`Above 40% heat, glitches you aren't pressing kick in by themselves for 20–150 ms`,"熱が 45% をこえると、勝手にグリッチ・砂嵐・音の張り付き・一瞬の無音が起きる。HEAT の LED が速く点滅し、画面が震える":`Above 45% heat you get random glitches, static, stuck sound and moments of silence. The HEAT LED blinks fast and the screen shakes`, ws (RESO adds a twangy resonance).`,"FEEDBACK = 音が自分に返ってこだまする（SHORT = 4ms のビリビリ、LONG = 280ms のこだま）。PITCH = スイッチ ON で全体の音程を ±1 オクターブ変える。":`FEEDBACK = the sound loops back on itself (SHORT = 4 ms buzz, LONG = 280 ms echo). PITCH = with the switch on, shifts everything ±1 octave.`,"こすれ！ 止めろ！ 暗くしろ！":`Scratch it! Stop it! Shade it!`,"子供用 DJ セット。ディスクをこすってスクラッチ、6 つの効果音パッド、13 鍵のキーボード、28 種類のリズム（うち 7 つは隠しパターン）。そこへピッチの粗・微調整、テープのように止まる STOP、光センサー、2 つの DIST と FEEDBACK を後付けした魔改造機だ！":`A children's DJ set: scratch the disc, 6 sound-effect pads, a 13-key keyboard and 28 rhythms (7 of them hidden). We added coarse/fine pitch, a tape-stop STOP, a light sensor, two DISTs and FEEDBACK. A modded machine!`,"右下の大きな緑のボタン（OFF は右の青いボタン）":`The big green button at the bottom right (OFF is the blue one to its right)`,"電源 ON（緑）と OFF（青）。":`Power ON (green) and OFF (blue).`,"PC の Enter（電源 OFF のとき）、PgUp / PgDn":`PC Enter (when off), PgUp / PgDn`,ディスク:`Disc`,"マウスでつかんで回すとスクラッチ。DISC EFFECT の音をこする。":`Grab and spin it with the mouse to scratch. It scratches the DISC EFFECT sound.`,"PC の . / で前・逆に回す（押している間）":`PC . / spin forward / backward (while held)`,"ディスクでこする音を選ぶ（21 種）。":`Choose the sound the disc scratches (21 kinds).`,"PC の F1〜F5":`PC F1–F5`,"SOUND EFFECT パッド":`SOUND EFFECT pads`,"6 つの効果音。EFFECT SELECTION で音のセットを変える。":`6 sound effects. EFFECT SELECTION changes the set.`,"PC の Z X C V B N、セットは 8 9 0 - ^":`PC Z X C V B N; sets are 8 9 0 - ^`,"鍵盤・KEYBOARD PATTERN・INSTRUMENT":`Keys, KEYBOARD PATTERN, INSTRUMENT`,"C〜C の 13 鍵。INSTRUMENT で 10 種の音色、PATTERN 2 でアルペジオ。":`13 keys from C to C. INSTRUMENT picks one of 10 sounds, PATTERN 2 gives arpeggios.`,"PC の A W S E D F T G Y H U J K、← → で音色、Tab でパターン":`PC A W S E D F T G Y H U J K; ← → for sounds, Tab for pattern`,"リズム 28 種類を選ぶ（1-7・8-14・15-21 と、隠しの 22-28）。":`Choose from 28 rhythms (1-7, 8-14, 15-21 and the hidden 22-28).`,"PC の 1 2 3 4。押すたびに次へ":`PC 1 2 3 4. Each press moves on`,"リズムを鳴らす・止める。RHYTHM EFFECT は押している間、リズムを細かく刻む。":`Plays / stops the rhythm. RHYTHM EFFECT chops it up while held.`,"PC の Space で PLAY / PAUSE、Enter で EFFECT":`PC Space for PLAY / PAUSE, Enter for EFFECT`,"リズムの速さを 4 ずつ上げ下げ。":`Rhythm tempo up / down in steps of 4.`,"リズムの速さ（60〜200 BPM）。":`Rhythm tempo (60–200 BPM).`,"PITCH（スイッチ・COARSE・FINE）":`PITCH (switch, COARSE, FINE)`,"スイッチ ON で全体の音程を変える。COARSE = ±12 半音、FINE = ±1 半音。":`With the switch on, shifts the overall pitch. COARSE = ±12 semitones, FINE = ±1 semitone.`,"PC の P でスイッチ":`PC P for the switch`,"押している間、テープが止まるように音程ごと落ちていく。離すと戻る。":`While held, everything slows down and drops in pitch like a stopping tape. Let go to recover.`,"PC の Backspace":`PC Backspace`,"光センサー・LIGHT":`Light sensor, LIGHT`,"LIGHT スイッチ ON のとき、左右の丸いレンズにマウスを近づけると影になって音程が下がる。押さえるとまっ暗。":`With LIGHT on, bringing the mouse near the round lenses shades them and lowers the pitch. Pressing on them makes it pitch-dark.`,"PC の L でスイッチ":`PC L for the switch`,"DIST = かたよった歪み、DIST 2 = 整流してオクターブ上が混ざる荒い歪み。それぞれ ON/OFF とツマミ。":`DIST = lopsided distortion, DIST 2 = rectified, rough distortion with an octave up mixed in. Each has on/off and a knob.`,"音を自分に返す。どの音を返すかを RHYTHM・DISC・ALL（全部）から選ぶ。":`Feeds the sound back into itself. Choose what to feed back: RHYTHM, DISC or ALL.`,"エンジンの爆発を、音階で弾け！":`Play the engine's explosions as a scale!`,"子供用ドライブ・ダッシュボード（オリジナル設計）。エンジン音は「点火の粒」でできていて、改造パネルで点火を間引くとリズムになり、TUNE で音階になる。MIDI やシーケンサーでエンジンそのものを弾けるのが自慢の魔改造機だ！":`A children's driving dashboard (our own design). The engine sound is made of "ignition grains": skip some with the mod panel and they become rhythms, and TUNE turns them into a scale. Its pride: you can play the engine itself from MIDI or the sequencer!`,"左の「POWER」の札のイグニッションキー（クリックで ON、ON のままクリックでエンジン始動）":`The ignition key on the "POWER" tag at the left (click for ON, click again to start the engine)`,"POWER（イグニッションキー）":`POWER (ignition key)`,"クリックで電源 ON（キーが ON の位置へ）。ON のままクリックしている間セルが回り、エンジンがかかる。KEY OFF で切る。":`Click to switch on (the key turns to ON). Keep clicking and the starter cranks until the engine starts. KEY OFF switches it off.`,"PC の Enter（押している間セルが回る）":`PC Enter (the starter cranks while held)`,"ACCEL（ペダル）":`ACCEL (pedal)`,"踏んでいる間アクセル。回転数（＝点火の速さ＝音の高さ）が上がる。":`Throttle while pressed. Revs (= ignition rate = pitch) go up.`,"PC の ↑ または W":`PC ↑ or W`,ハンドル:`Steering wheel`,"縁をつかんで回す（離すと戻る）。真ん中はホーン。":`Grab the rim to turn it (it springs back). The centre is the horn.`,"PC の ←\xA0→、Space でホーン":`PC ← →, Space for the horn`,"PC の ← →、Space でホーン":`PC ← →, Space for the horn`,"N・1〜5。ギアが高いほど回転がゆっくり追いつく。変えた瞬間、回転がガクッと変わる。":`N, 1–5. The higher the gear, the slower the revs catch up. The revs jump the moment you shift.`,"PC の Z / X":`PC Z / X`,"押している間ターボ。回転が一気に上がる。":`Turbo while held. Revs shoot up.`,"PC の T":`PC T`,"サイレン・ウインカーのカチカチ・ワイパー（ON/OFF）、CRASH! は衝突音。":`Siren, ticking indicator, wipers (on/off); CRASH! is a crash sound.`,"PC の S / V / B / C":`PC S / V / B / C`,ラジオ:`Radio`,"プリセット 1〜8 で選局。PRESET HIJACK 中は、プリセットのボタンがエンジンの音階（ド〜ド）になる。":`Presets 1–8 tune the station. During PRESET HIJACK the preset buttons become an engine scale (C to C).`,"PC の 1〜8、R で局を切り替え":`PC 1–8, R changes station`,"8 つの気筒のスイッチ。点火を間引くと、低い回転でリズムになる。CAM で点火パターンの長さ（3〜8）を変える。":`Switches for 8 cylinders. Skip ignitions and low revs turn into rhythms. CAM sets the pattern length (3–8).`,"この機械のキモ！ 間引いてからアクセルを少しだけ":`The heart of this machine! Skip some, then just a little throttle`,"REDLINE = 回転の上限を上げる（0 のままだとリミッターで点火が飛ぶ。上げるほど高く回る）、SPARK = 点火ごとにバチッとノイズ、RADIO BLEED = ラジオとエンジンが掛け算で混ざる。":`REDLINE = raises the rev limit (at 0 the limiter skips ignitions; higher revs higher), SPARK = a crackle on each ignition, RADIO BLEED = radio and engine multiply together.`,"TUNE = 回転数が音階にそろう、HIJACK = ラジオのボタンでエンジンを弾く、HORN BEND = ホーンが曲がる、GRIND = ギアを変えるたびにガリガリ。":`TUNE = revs snap to a scale, HIJACK = play the engine with the radio buttons, HORN BEND = the horn bends, GRIND = grinding on every gear change.`,"PC の U で TUNE、H で HIJACK":`PC U for TUNE, H for HIJACK`,"ON のとき、点火 1 回ぶん遅れた音を返して、回転に合わせて響く金属音になる。":`When on, it feeds back the sound one ignition late, making a metallic ring that follows the revs.`,"金属の丸に触ると：CHASSIS = ブーンというハムが乗り、点火がときどき飛ぶ。HAZARD = エンジンを細かく刻み、リレーのカチカチが増える。":`Touch the metal dots: CHASSIS = adds hum and sometimes skips ignitions. HAZARD = chops the engine finely with more relay clicks.`,"押している間、エンジンがかかっていてもセルモーターが回り続ける。":`While held, the starter motor keeps cranking even with the engine running.`,"STOP（移動停止）":`STOP (stop moving)`,"キーボードを、楽器として叩け！":`Play the keyboard as an instrument!`,"PC キーボードそのものを楽器に改造した（オリジナル設計）。全部のキーに役目があり、文字の段が音階、テンキーがドラム、F キーが波形・音階・「キーボードの故障」。上にはツマミを 12 個増設した魔改造機だ！":`A PC keyboard turned into an instrument (our own design). Every key has a job: the letter rows are scales, the numpad is drums, and the F keys pick waveforms, scales and "keyboard faults". With 12 extra knobs on top, it's a modded machine!`,"キーボードの左上の大きな緑のボタン（押すたびに ON / OFF）":`The big green button at the top left of the keyboard (each press toggles)`,"打った音の「行」、波形・音階・テンポなどが出る。":`Shows the "line" of typed notes, waveform, scale, tempo and more.`,"文字の段：音階":`Letter rows: scales`,"Z 段がいちばん低く、1 段上がるごとに約 4 度上。Shift を押している間はオクターブ下（左）・上（右）。":`The Z row is lowest; each row up is about a fourth higher. Hold Shift for an octave down (left) / up (right).`,"Space：SUSTAIN・その他の機能キー":`Space: SUSTAIN and other function keys`,"Space = 音を伸ばす。Enter = 打った「行」をループ、Tab = STUTTER、Caps = LATCH（鳴りっぱなし）、Del = CORRUPT、Ins = 上書き。":`Space = sustain. Enter = loop the typed "line", Tab = STUTTER, Caps = LATCH (keeps ringing), Del = CORRUPT, Ins = overwrite.`,"PULSE・SAW・BELL・NOISE の 4 つの波形。":`4 waveforms: PULSE, SAW, BELL, NOISE.`,"MAJOR・MINOR・PENTA・BENT（わざと少し狂った音階）。":`MAJOR, MINOR, PENTA, BENT (a deliberately detuned scale).`,"F9〜F12：キーボードの故障":`F9–F12: keyboard faults`,"GHOST = 隣のキーも勝手に鳴る、SCAN = 押しているキーを順番に読み取る（アルペジオに）、BOUNCE = チャタリングで連打、OVERFLOW = 行があふれて暴走。":`GHOST = neighbouring keys sound by themselves, SCAN = reads held keys one by one (an arpeggio), BOUNCE = key bounce repeats, OVERFLOW = the line overflows and runs wild.`,"歪み・ビットつぶし・こだま。":`Distortion, bit crushing, echo.`,"音量・音の減り方・明るさ。":`Volume, decay, brightness.`,"行ループの速さ（60〜240 BPM）と、ピッチベンドの幅（0〜12 半音）。":`Line-loop speed (60–240 BPM) and pitch-bend range (0–12 semitones).`,"「キーボードの故障」の強さ（GHOST の出やすさ・SCAN の速さ・BOUNCE の回数）と、キーを打つカチッという音の大きさ。":`Strength of the "keyboard faults" (how often GHOST fires, SCAN speed, BOUNCE count) and the volume of the key clicks.`,"状態 LED":`Status LEDs`,"POWER・LOOP・LATCH・OVR・STUT・CORRUPT・GHOST・SCAN・BOUNCE・OVERFLOW のどれが効いているか。":`Which of POWER, LOOP, LATCH, OVR, STUT, CORRUPT, GHOST, SCAN, BOUNCE, OVERFLOW are active.`,"映像も、音も、いっしょに壊せ！":`Wreck the picture and the sound together!`,"ブラウン管モニター付きの魔改造キーボード（オリジナル設計）。Web カメラ・別のタブ・動画ファイルの映像と音を取り込んで、キーで同時に壊す。キーの下の小さな文字が「映像の壊れ方／音の壊れ方」。GLITCH ボタン×BASE の一発グリッチ、ノブ 8 個、熱による暴発つきの映像マシンだ！":`A modded keyboard with a CRT monitor (our own design). It captures picture and sound from a webcam, another tab or a video file and wrecks them with keys. The small text under each key is "picture effect / sound effect". One-shot GLITCH × BASE glitches, 8 knobs and heat runaways: a video machine!`,"モニターの右下の大きな緑のボタン（押すたびに ON / OFF）":`The big green button at the bottom right of the monitor (each press toggles)`,"押すたびに電源 ON / OFF。ON でブラウン管が「ボン」と点く。":`Each press switches on / off. When on, the CRT lights up with a "bong".`,"PC の PgUp / PgDn でも":`PC PgUp / PgDn work too`,モニター:`Monitor`,"取り込んだ映像を、効いているグリッチで壊して映す（WebGL）。入力が無いときは砂嵐。":`Shows the captured picture wrecked by the active glitches (WebGL). Static when there is no input.`,入力の切り替え:`Input select`,"TAB を取り込む（別のタブの映像と音）・FILE（動画ファイル）・CAM（Web カメラ）・TEST（自動で作るテスト映像）・✕（外す）。→ 8 章":`Capture a TAB (picture and sound from another tab), FILE (video file), CAM (webcam), TEST (generated test video), ✕ (disconnect). → chapter 8`,"壊した後の映像と音を録画して、WebM で保存。もう一度押すと止めて保存。":`Records the wrecked picture and sound and saves WebM. Press again to stop and save.`,"Q〜［・A〜］：グリッチキー":`Q–[ · A–]: glitch keys`,"押している間だけ効く 24 種のグリッチ。映像と音が同時に壊れる（→ 8 章の表）。":`24 glitches that work while held. Picture and sound break together (→ table in chapter 8).`,"Z〜＼：楽器キー":`Z–\\: instrument keys`,"ビープ・ノイズ・キック・スネア・ハット・ドローン・ザップ・ブリップ・ブザー・チャープ（音階つき）。":`Beep, noise, kick, snare, hat, drone, zap, blip, buzzer, chirp (pitched).`,"GLITCH ボタン 1〜5":`GLITCH buttons 1–5`,"押すと、今の BASE で決まる「一発グリッチ」が約 1 秒かかる（5×5 = 25 種、→ 5 章）。":`Fires the "one-shot glitch" set by the current BASE for about a second (5×5 = 25 kinds, → chapter 5).`,"TAPE・DIGITAL・SIGNAL・BEEP・MELTDOWN の 5 段。一発グリッチの種類が変わる。":`5 levels: TAPE, DIGITAL, SIGNAL, BEEP, MELTDOWN. Changes the one-shot glitch.`,"1〜0：キューポイント":`1–0: cue points`,"映像の 10%〜90%・0% へ飛ぶ。Shift＋数字で今の位置を登録。":`Jump to 10%–90% / 0% of the video. Shift+number stores the current position.`,"押している間、今の映像と音をつかんで繰り返す。":`While held, grabs and repeats the current picture and sound.`,"HOLD = 今効いているグリッチをつかんで、キーを離しても続ける。RELEASE = 全部止める。":`HOLD = keeps the active glitches going after you let go. RELEASE = stops them all.`,"PC の Tab・F11・F12":`PC Tab, F11, F12`,"グリッチの強さ・うねりの速さ・深さ・映像も音も自分に返るフィードバック。":`Glitch strength, wobble speed and depth, and feedback for picture and sound.`,"歪み・再生の速さと音程・元の音と壊した音の割合・全体の音量。":`Distortion, playback speed and pitch, dry/wet mix, master volume.`,"歪みの種類（CLIP / CRUSH）、LFO の行き先（VIDEO / AUDIO / BOTH）、キーの混線（ON で隣のキーも効いたり、押すたびに別の効果になったり）。":`Distortion type (CLIP / CRUSH), LFO target (VIDEO / AUDIO / BOTH), key crosstalk (on: neighbours fire too, or a key does something different each press).`,"HEAT の LED":`HEAT LED`,"熱（ストレス）。熱いほど速く赤く点滅し、画面が震え、勝手にグリッチが暴れる。固まらない。":`Heat (stress). The hotter it is, the faster it blinks red, the screen shakes and glitches run wild. It never freezes.`,"音を食べて、切って、並べろ！":`Eat sounds, chop them, arrange them!`,"子ども用の録音おもちゃ（ワニの口のスピーカー付き）を魔改造したサンプラー。16 パッド × 16 バンクに、録った声・読み込んだ音・最初から入っている 32 音を入れて叩く。ラックとスタジオではこの小さい版で叩いて録って自動作曲、音の作り込み（録音・チョップ・エフェクト・ベンド・パターン）は専用のページ（サンプラー編）で！":`A sampler made by modding a children's recording toy (with a crocodile-mouth speaker). Fill 16 pads × 16 banks with recorded voices, loaded sounds and the 32 built-in ones, then hit them. In the rack and studio this small version plays, records and auto-composes; sound building (recording, chopping, effects, bending, patterns) happens on its own page (see "The sampler").`,"左上の赤いボタン（パクッ、パクッと鳴って起動）。電源 OFF のときは Enter でも入る":`Red button at the top left (it chomps twice as it starts). When off, Enter works too`,"電源の入／切。入れると「パクッ、パクッ」と鳴って、パッドが明るくなる。":`Power on/off. When switched on it chomps twice and the pads light up.`,"電源 OFF のときは Enter キーでも入る":`When off, Enter works too`,"いま選んでいるパッドと音の名前、入っている音の数。下は波形：赤い線が鳴らす範囲（START・END）、明るい線が再生位置。":`The selected pad, its sound name and the number of sounds. Below is the waveform: red lines mark the range played (START / END), the bright line is the playhead.`,"全部のパッドの音程を ±12 半音／鳴らし始めを後ろへずらす（ノブを回すほどスライスの途中から）。":`Shift all pads ±12 semitones / move the start later (the further you turn, the later into the slice).`,"出口のローパス。回すほどこもる・RESO でピーキーなクセ。":`Output low-pass. Turn to muffle; RESO adds a peaky resonance.`,"自動作曲では、盛り上げの所でだんだん開く":`The auto-composer opens it gradually in build-ups`,"歪ませる／ビットとサンプルを落としてガリガリにする。":`Distort / crush bits and sample rate into grit.`,"やまびこの量と間隔（30〜750ms）。":`Echo amount and spacing (30–750 ms).`,"上げるほど基板のジャンパー線が増えて、再生がカクカク・ザリザリに壊れる（0 ならサンプラーのページの設定）・壊れる頻度。":`The higher, the more jumper wires on the board and the more playback stutters and crackles (0 = the sampler page setting) / how often it breaks.`,"MIDI の CC1（モジュレーション）でも動く":`MIDI CC1 (modulation) moves it too`,"音量（改造パーツの後ろなので、歪ませても大きくなりすぎない）。":`Volume (it comes after the mods, so distortion doesn't make it too loud).`,"全部のパッドを逆再生／サンプラーのページで決めたエフェクトを入・切。":`Reverse all pads / turn the sampler page's effects on or off.`,"いま選んでいるパッドを、メロディ用・ベース用・和音用にする。シーケンサーの「♪」「BASS」「CHORD」の行で、そのパッドの音を音程を変えて弾ける。自動作曲は、スタイルに合う楽器をここに自動で選ぶ。":`Use the selected pad for melody, bass or chords. The "♪", "BASS" and "CHORD" rows in the sequencer play it at different pitches. The auto-composer picks instruments that suit the style here.`,"バンク C〜G はジャンルの楽器（和・レゲエ・ジャズ・ダンス・ポップ）。自分で録った声をメロディにすると楽しい":`Banks C–G hold genre instruments (Japanese, reggae, jazz, dance, pop). Using your own recorded voice as the melody is fun`,"↻（読み直す）・SAMPLER ↗":`↻ (reload) · SAMPLER ↗`,"サンプラーのページで作った音（このブラウザに保存したもの）を読み直す／サンプラーのページを別のタブで開く。":`Reload the sounds made on the sampler page (saved in this browser) / open the sampler page in a new tab.`,"鳴っている音を全部止める（ループしている音も）。":`Stops everything that is playing (looping sounds too).`,"16 パッドの組を切り替える。音の入っているバンクは水色。":`Switches between sets of 16 pads. Banks with sounds are light blue.`,"PC の [ ]":`PC [ ]`,"左下が 1。押すと鳴る。♪ と BASS の印はメロディ用・ベース用のパッド。":`Bottom left is 1. Press to play. ♪ and BASS mark the melody and bass pads.`,"PC の Z X C V・A S D F・Q W E R・1 2 3 4 がパッドと同じ並び":`PC Z X C V · A S D F · Q W E R · 1 2 3 4 match the pad layout`,"→ 7 章":`→ chapter 7`,このブラウザに保存される:`saved in this browser`,"PC の - ^ @ [":`PC - ^ @ [`,"PC の Enter / BS":`PC Enter / BS`,"PC の F6〜F10":`PC F6–F10`,"押すたびに新しいシードで曲を作り、シーケンサーに書き込んで、頭から鳴らす。":`Each press writes a song with a new seed into the sequencer and plays it from the top.`,"いまの曲のシード（種）の番号。数字を入れて Enter で、そのシードの曲を作る。":`The current song's seed number. Type a number and press Enter to build that seed's song.`,"シードはそのまま、変えた STYLE・壊れ度・長さ・BPM で作り直す。":`Rebuilds with the same seed but the changed STYLE, CHAOS, length and BPM.`,"26 種類：演歌・音頭・レゲエ・スカ・ボサノバ・ジャズ・ハウス・ドラムンベース・IDM など。◀ ▶ で順に、まん中を押すと一覧から選べる。下にそのスタイルの説明（→ 9 章の表）。":`26 styles: enka, ondo, reggae, ska, bossa nova, jazz, house, drum & bass, IDM and more. ◀ ▶ step through them, the middle opens the list. The style's description is shown below (→ table in chapter 9).`,"押して光ったおもちゃが、同じ 1 つの曲に入る。ビートは 1 台が刻み、メロディは 2 小節ずつ掛け合い。点線のおもちゃ（このパネルの持ち主）はいつも参加。":`Toys you light up join the same song. One plays the beat, and melodies trade every 2 bars. The dotted toy (this panel's owner) always joins.`,"グリッチ・歪み・クラッシュの量（0〜100%）。":`Amount of glitches, distortion and crashes (0–100%).`,"曲の長さ：30 秒・1 分・2 分・3 分。":`Song length: 30 s, 1 min, 2 min, 3 min.`,"テンポ。STYLE を変えると、そのスタイルのふつうのテンポに戻る。":`Tempo. Changing STYLE resets it to that style's usual tempo.`,"セクション選び ＋ このセクションだけ作り直す":`Section select + Redo only this section`,"選んだセクション（サビなど）だけを作り直す。ほかの場所は 1 音も変わらない。":`Rebuilds only the chosen section (e.g. the chorus). Nothing else changes.`,"再生 / 停止":`Play / Stop`,"曲を頭から鳴らす・止める。":`Plays the song from the top / stops it.`,"URL をコピー":`Copy URL`,"この曲の URL をコピー。送った相手が開くと、同じ曲が作られる。":`Copies this song's URL. Whoever opens it gets the same song.`,"最初へ・再生 / 停止・手で弾いた操作の録音（● の付いたトラックへ重ね録り）。":`To start, play / stop, record what you play (overdub into tracks marked ●).`,位置:`Position`,"小節.拍・時間・いまのセクション名。":`Bar.beat, time and the current section name.`,"BPM・長さ":`BPM / length`,"テンポと、曲の長さ（小節）。":`Tempo and song length (bars).`,"LOOP・グリッド・クリック":`LOOP / grid / click`,"ループ範囲をくり返す・音符を置くマス目の細かさ・メトロノーム。":`Repeat the loop range, grid resolution for placing notes, metronome.`,"曲の乱数の種。頭から再生すると、おもちゃを新品にしてこの種で鳴らすので、毎回同じ音・同じグリッチ。":`The song's random seed. Playing from the top resets the toys and uses this seed, so you get the same sound and glitches every time.`,"保存・読込":`Save / Load`,"曲を JSON ファイルに保存・読み込み（曲はこのブラウザにも自動で保存される）。":`Save / load the song as a JSON file (it is also saved automatically in this browser).`,"WAV・WebM・MIDI":`WAV / WebM / MIDI`,"書き出し。WAV = 音（速く作る）、WebM = 映像込み（曲の長さだけかかる）、MIDI = 将来の VST・DAW 用。":`Export. WAV = sound (rendered fast), WebM = with video (takes as long as the song), MIDI = for future VST / DAW use.`,"上段 = セクション名（ダブルクリックで追加・名前変更）、下段 = クリックで再生位置、ドラッグでループ範囲。":`Top = section names (double-click to add / rename), bottom = click for playhead, drag for loop range.`,トラックと行:`Tracks and rows`,"左がトラック名（M ミュート・🔒 鍵・● 録音先・＋ 行を追加）、右が音符とツマミの動き。":`Left: track names (M mute, 🔒 lock, ● record target, + add a row). Right: notes and knob moves.`,"いまのパッド（A-01 など）・音の名前と長さ・波形（赤い線が START と END）。下の段はお知らせ・テンポ・入っているエフェクト・入力と出力の音の大きさ。PATTERN・SONG タブではパターンの中身になる。":`The current pad (A-01 etc.), sound name and length, waveform (red lines = START and END). The bottom row shows messages, tempo, active effects and input/output levels. On the PATTERN and SONG tabs it shows the pattern.`,ノブのページ:`Knob pages`,"SOUND（音量・パン・音程・微調整）・FILTER・ENV・SAMPLE（START・END・LOOP・強さの効き）・MIX（ミュートグループ・送り先・音の BPM）・FX・SEQ・BEND。":`SOUND (volume, pan, pitch, fine), FILTER/ENV, SAMPLE (START, END, LOOP, velocity), MIX (mute group, bus, sound BPM), FX, SEQ, BEND.`,"ページの名前のとおりに働く。上下にドラッグ、ダブルクリックで初期値。":`They do what the page says. Drag up/down, double-click to reset.`,機能タブ:`Function tabs`,"PAD（録音・再生のしかた）・PLAY（ロール・16 レベル・テンポ）・EDIT（波形・チョップ）・FX・BEND・PATTERN・SONG で、下のボタンが替わる。":`PAD (recording, playback), PLAY (roll, 16 levels, tempo), EDIT (waveform, chop), FX, BEND, PATTERN, SONG: the buttons below change.`,"REC → 録るパッドを押す → 声や音を入れる → REC で止める。RESAMPLE は自分が鳴らしている音を録る。":`REC → press the pad to record into → make a sound → REC to stop. RESAMPLE records what you are playing.`,"GATE・LOOP・REV・POLY":`GATE / LOOP / REV / POLY`,"押している間だけ鳴る・くり返す・逆再生・押し直しで重ねる（パッドごと）。":`Plays only while held, loops, reverses, layers on retrigger (per pad).`,"VOL と STOP":`VOL and STOP`,"全体の音量と、鳴っている音を全部止めるボタン（パターンの再生も止まる）。":`Master volume, and a button that stops everything (pattern playback too).`,"16 パッド × 16 バンク = 256 音。音の入っているバンクは水色。":`16 pads × 16 banks = 256 sounds. Banks with sounds are light blue.`,"パッド 16 個":`16 pads`,"左下が 1。押すと鳴って、そのパッドを選ぶ。上の方を押すほど強い。モードによってはパターン選び・ステップ（16 分のマス）になる。":`Bottom left is 1. Press to play and select it; higher = harder. In some modes they pick patterns or become steps (16th grid).`,"1 ADDR（読む場所が壊れる）":`1 ADDR (the read position breaks)`,"2 DATA（音のデータが壊れる）":`2 DATA (the sound data breaks)`,"3 CLOCK（速さが壊れる）":`3 CLOCK (the speed breaks)`,"4 BEEP（ブザーが混ざる）":`4 BEEP (a buzzer mixes in)`,"5 VOICE（別の声に化ける）":`5 VOICE (turns into another voice)`,"読む場所の一部が固定され、決まった所だけが繰り返される":`Part of the read position gets stuck, so only certain spots repeat`,"音があちこち先へ飛ぶ。しゃべりが早口の切れ切れに":`The sound jumps ahead all over. Speech becomes fast and chopped`,"少しずつ巻き戻っては進む。「キ、キ、キング」":`Rewinds a little, then moves on: "Ki, ki, king"`,"押した所へ連続で戻る。ババババ":`Keeps jumping back to where you pressed: ba-ba-ba-ba`,"細かく前後に行ったり来たり。逆再生まじり":`Jitters back and forth, with bits of reverse`,データのビットが反転してジリジリ化ける:`Data bits flip and it fizzes and mutates`,細かい部分が消えてガサガサの低音質に:`Fine detail vanishes into gritty low fidelity`,短いバッファを繰り返す:`Repeats a short buffer`,"いちばん上のビットが固定されて、音がひっくり返ったような爆音に":`The top bit gets stuck and the sound flips into a blast`,"データの上下が入れ替わり、声がノイズの塊に":`The data flips upside down and the voice becomes a lump of noise`,"0.25〜0.66 倍にゆっくり、低く（押した瞬間に決まる）":`Slower and lower, 0.25–0.66× (fixed when you press)`,"1.5〜4 倍に速く、高く（押した瞬間に決まる）":`Faster and higher, 1.5–4× (fixed when you press)`,音程がぐにゃぐにゃ揺れる:`The pitch wobbles like jelly`,音程が階段みたいにカクカク飛ぶ:`The pitch jumps in steps like a staircase`,"出した音で速さが変わるループ。暴れ出すと止まらない":`A loop where the output changes the speed. Once it runs wild it won't stop`,音の大きさに合わせてピーピー鳴る矩形波が混ざる:`A beeping square wave follows the loudness`,金属っぽいリングモジュレーション:`Metallic ring modulation`,ビープの和音がジャーン:`A crashing chord of beeps`,"ランダムな高さのピコピコが 30ms ごとに走る":`Random-pitched bleeps race by every 30 ms`,"「そのまま・止まる・無音」が細かく切り替わる":`"Normal / frozen / silent" switch rapidly`,"同じモードの別のキーの声に化ける（液晶のキャラも化ける）":`Turns into the voice of another key in the same mode (the screen character changes too)`,別のキーの声のあちこちへ次々に飛ぶ:`Jumps from one key's voice to another`,"別のキーやシステム音（起動音など）の断片がごちゃまぜ":`A jumble of fragments from other keys and system sounds (startup sound etc.)`,"起動音や「RIGHT!」がしゃっくりのように割り込む":`The startup sound and "RIGHT!" butt in like hiccups`,"声の形のままノイズになる（ささやき声っぽく）":`Becomes noise in the shape of the voice (like whispering)`,"テープのゆれ（ワウ・フラッター）":`Tape wobble (wow and flutter)`,"テープが食われて、ところどころ音が抜ける":`The tape gets chewed and the sound drops out here and there`,テープが止まるように音程ごと落ちる:`Drops in pitch like a stopping tape`,巻き戻しのような逆回転:`Reverse spin like rewinding`,押した所の短い一片をダダダと連打:`Machine-guns a short slice of where you pressed`,"速く・高く（リスの声）":`Faster and higher (chipmunk voice)`,"細かく音が切れる（ドロップアウト）":`Rapid dropouts`,"砂嵐（ノイズ）がかぶる":`Static (noise) on top`,"ハウリングの「ピー」が混ざる":`A feedback squeal mixes in`,チャープ音が飛び交う:`Chirps fly around`,リングモジュレーターの周波数が上がっていく:`The ring-modulator frequency keeps rising`,ザップの連打:`A barrage of zaps`,"止まる・急発進を細かく繰り返す":`Stops and lurches forward over and over`,急降下:`Nosedive`,ドローンがふくらむ:`A drone swells up`,"ランダムに 5 つのグリッチを同時に":`5 random glitches at once`,あちこちの断片にばらまく:`Scatters it into fragments everywhere`,映像と音のグリッチを組み合わせて一気に:`Combines picture and sound glitches in one hit`,ロボット読み上げ:`Robot reader`,"MODE を WORD に":`Set MODE to WORD`,"STRETCH を ON（HOLD のツマミを上げ気味に）":`Turn STRETCH on (HOLD knob fairly high)`,文字キーを押す:`Press a letter key`,"「K IS FOR KING」が 25ms の粒で引き伸ばされて、カクカクのロボット声になる。":`"K IS FOR KING" gets stretched in 25 ms grains into a jerky robot voice.`,言いまちがいマシン:`The mispronouncing machine`,"MODE を SAY に":`Set MODE to SAY`,"BASE を 5（VOICE）に":`Set BASE to 5 (VOICE)`,"GLITCH 1（MISREAD）を押しながら文字キー":`Hold GLITCH 1 (MISREAD) and press letter keys`,"「KING」のはずが別の単語に化ける。液晶のキャラまで化けるので見た目もおかしい。":`"KING" turns into another word. Even the screen character changes, so it looks wrong too.`,バグったドラムマシン:`The buggy drum machine`,"MODE を DRUM に":`Set MODE to DRUM`,"BASE を 3（CLOCK）に":`Set BASE to 3 (CLOCK)`,"GLITCH 4（STAIRS）を押しながら、文字キーでリズムを刻む":`Hold GLITCH 4 (STAIRS) and tap a rhythm on the letter keys`,"キックやスネアの音程が階段みたいに飛んで、壊れたリズムマシンになる。":`The kick and snare pitches jump like stairs: a broken rhythm machine.`,"ループ / LOOP HOLD":`Loop / LOOP HOLD`,"LOOP HOLD → LFO 全開 → STRETCH":`LOOP HOLD → LFO full → STRETCH`,"STRETCH を ON にしておく":`Turn STRETCH on first`,"文字キーを押し、鳴っている間に LOOP HOLD（Space）":`Press a letter key and, while it sounds, LOOP HOLD (Space)`,"LFO DEPTH と LFO RATE を上げる → サイレンのようにうねる":`Raise LFO DEPTH and LFO RATE → it wails like a siren`,"LOOP RELEASE（Enter）で放すと、今度は STRETCH が引き継いでカクカク進む":`Release with LOOP RELEASE (Enter) and STRETCH takes over, stuttering forward`,"LFO はループ中だけ効き、ループ中は STRETCH より LOOP が優先。だから「うねり → 放した瞬間にカクカク」の二段変化になる。":`The LFO only works while looping, and LOOP beats STRETCH while looping. So you get a two-stage change: "wail → stutter the moment you release".`,ビープ暴走:`Beep runaway`,"BASE を 4（BEEP）に":`Set BASE to 4 (BEEP)`,"GLITCH 5（FEEDBACK）と GLITCH 1（RUNAWAY）を同時押し":`Press GLITCH 5 (FEEDBACK) and GLITCH 1 (RUNAWAY) together`,"DIST を上げて FOLD に":`Raise DIST and set it to FOLD`,"出した音が速さを変え、それがまた音を変える。熱もすぐたまるので、暴発と隣り合わせ！":`The output changes the speed, which changes the output again. Heat builds fast, so a runaway is never far away!`,電池切れのデモ演奏:`The dying-battery demo`,"Enter で DEMO":`Enter for DEMO`,"CPU POWER をゆっくり下げる":`Slowly lower CPU POWER`,"FEEDBACK を上げて LONG に":`Raise FEEDBACK and set it to LONG`,"デモ曲もリズムも遅く・低く・よれていき、こだまが重なる。下げすぎると音が化けて止まる。":`The demo and rhythm get slower, lower and wobblier, with echoes piling up. Go too far and it mutates and stops.`,楽器の線を押さえっぱなし:`Holding down the instrument lines`,"PIKOTONE の INST HOLD は、楽器を選ぶ線を押さえた改造。ON にした音色の波形が混ざり合う。":`PIKOTONE's INST HOLD is a mod that holds down the instrument-select lines. The waveforms of the sounds you turn on blend together.`,"SPIN-TOT の隠しリズム 22〜28":`SPIN-TOT's hidden rhythms 22–28`,"リズムの 4 キーを押すと、隠しパターン 22〜28 へ。5・7・11・13・9・15・6 ステップの変拍子で、音もばらばら。":`Press rhythm key 4 for the hidden patterns 22–28: odd meters of 5, 7, 11, 13, 9, 15 and 6 steps, with scattered sounds too.`,"テープストップ・スクラッチ":`Tape stop + scratch`,"リズムを PLAY":`PLAY the rhythm`,"Backspace（STOP）を押したり離したり":`Press and release Backspace (STOP)`,ディスクをこする:`Scratch the disc`,"STOP は音程ごと落ちていくテープ止め。こするスクラッチと合わせると DJ っぽい。":`STOP is a tape stop that drops in pitch. Combined with scratching it sounds like a DJ.`,ラジオでエンジンを弾く:`Play the engine with the radio`,"VROOMBOX の PRESET HIJACK を ON にすると、ラジオのプリセット 1〜8 がエンジンの音階（ド〜ド）になる。":`With VROOMBOX's PRESET HIJACK on, radio presets 1–8 become an engine scale (C to C).`,"エンジン・ドラム":`Engine drums`,"Enter で電源 ON → もう一度 Enter を押し続けてエンジンをかける":`Enter to switch on → hold Enter again to start the engine`,"FIRING ORDER のスイッチをいくつか OFF":`Turn off some FIRING ORDER switches`,"アクセルを少しだけ踏み、TUNE を ON":`Press the throttle just a little and turn TUNE on`,"点火が間引かれて、低い回転ではリズムになる。TUNE で回転が音階にそろう。":`Ignitions are skipped, so low revs become a rhythm. TUNE snaps the revs to a scale.`,故障アルペジオ:`The broken arpeggio`,"F10 で SCAN、F11 で BOUNCE":`F10 for SCAN, F11 for BOUNCE`,"和音になるようにキーをいくつか押す（押しっぱなしにしなくていい）":`Press a few keys that make a chord (no need to hold them)`,"Caps（LATCH）を ON":`Turn on Caps (LATCH)`,"押しているキーを順番に読み取る「SCAN」でアルペジオに、チャタリングの「BOUNCE」で連打が重なる。":`"SCAN" reads the held keys one by one into an arpeggio, and "BOUNCE" adds key-bounce repeats on top.`,行ループの上書き:`Overwriting the line loop`,"TYPOTRON で Enter の行ループ中に Ins（上書き）を ON にして打つと、今鳴っている所が書き換わる。":`On TYPOTRON, turn on Ins (overwrite) during an Enter line loop and type: the note playing now gets replaced.`,"MELTDOWN の CHAOS":`MELTDOWN's CHAOS`,"F10 で BASE 5（MELTDOWN）":`F10 for BASE 5 (MELTDOWN)`,"F5 で CHAOS":`F5 for CHAOS`,"ランダムな 5 つのグリッチが同時にかかる一発技。熱も一気に上がる。":`A one-shot move with 5 random glitches at once. Heat jumps too.`,混線ルーレット:`Crosstalk roulette`,"F12 で CROSSTALK を ON":`F12 to turn CROSSTALK on`,同じグリッチキーを何度も押す:`Press the same glitch key again and again`,"押すたびに隣のキーが混ざったり別の効果になったりする。何が出るかはお楽しみ。":`Each press mixes in a neighbour or does something else. You never know what you'll get.`,キューポイント:`Cue points`,キューポイントの登録:`Storing cue points`,"TELEKEY で Shift＋数字を押すと、その数字キーに今の位置を登録できる。":`On TELEKEY, Shift+number stores the current position on that number key.`,つかんで離す:`Grab and let go`,"グリッチキーを 2〜3 個押す":`Press 2–3 glitch keys`,"そのまま Enter（HOLD）":`Then Enter (HOLD)`,"キーを離して、楽器キー（Z〜）でリズムを弾く":`Release the keys and play a rhythm on the instrument keys (Z…)`,"BS（RELEASE）で全部止める":`BS (RELEASE) stops everything`,"HOLD で映像と音の壊れ方を固定したまま、両手で別のことができる。":`HOLD freezes how the picture and sound are broken, leaving both hands free.`,スタジオ:`Studio`,"自動作曲 → 鍵 → 作り直し":`Auto-compose → lock → redo`,"気に入ったトラックの 🔓 を押して 🔒 に":`Press 🔓 on a track you like to make it 🔒`,もう一度自動作曲:`Auto-compose again`,"鍵を掛けたトラックだけ残って、ほかが新しくなる。いいビートを残してメロディだけ探せる。":`Only locked tracks stay and the rest is new. Keep a good beat and hunt for a melody.`,"BASE 5（VOICE）の MISREAD・SCRAMBLE・GARBAGE 中は、声だけでなく液晶の文字とキャラも「誤読みしたキー」のものに変わる。":`During BASE 5 (VOICE) MISREAD, SCRAMBLE and GARBAGE, not just the voice but also the screen's letter and character switch to the misread key.`,"トイPC の液晶が化ける":`The toy PC's screen mutates`,毎回同じグリッチ:`The same glitches every time`,"シーケンサーで曲の頭から再生すると、おもちゃを新品にしてシードで鳴らすので、グリッチまで毎回同じになる。暴発も同じ所で起きる！":`Playing a song from the top in the sequencer resets the toys and uses the seed, so even the glitches are identical every time. Runaways happen in the same places!`,"TELEKEY の起動音":`TELEKEY's startup sound`,"電源を入れると、ブラウン管の「ボン」と「ピッ」が鳴る。クラッシュから再起動するときも鳴る。":`Switching on plays the CRT's "bong" and "beep". It also plays when rebooting after a crash.`,"電源が入らない!?":`It won't switch on!?`,"トイPC の LOOP スイッチがいちばん下（MUTE）だと、実物どおり電源が入らない。吹き出しで教えてくれるので、上か真ん中に戻そう。":`If the toy PC's LOOP switch is at the bottom (MUTE), it won't power on, just like the real thing. A bubble tells you; move it up or to the middle.`,"F キーが効かない":`The F keys don't work`,"F6・F7・F11・F12 などは、ブラウザが先に使ってしまうことがある。そのときは画面のキーをマウスでクリックしよう。":`Browsers sometimes grab F6, F7, F11, F12 and so on first. If so, click the on-screen keys with the mouse.`,"音が出ない！":`No sound!`,"まず POWER（電源）が入っているか見よう（ボタンの横の LED が緑に光る）。ブラウザは「最初に画面を操作するまで音を出さない」決まりなので、POWER を押すか Enter で電源を入れると音の準備もできる。音量のツマミ・パソコンの音量・ブラウザのタブがミュートになっていないかも確認。トイPC は LOOP スイッチが MUTE（いちばん下）だと音が出ない。":`First check that POWER is on (the LED by the button glows green). Browsers won't play sound until you interact with the page, so pressing POWER or Enter also gets the sound ready. Check the volume knob, your computer's volume and that the browser tab isn't muted. The toy PC makes no sound with LOOP at MUTE (bottom).`,キーを押しても反応しない:`Keys don't respond`,"電源 OFF のまま触ると、POWER ボタンがピカッと光って教えてくれる。スタジオでは、クリックしたおもちゃ（緑の枠）にキーボードがつながる。シーケンサーをクリックした後はキーボードがシーケンサー用になるので、おもちゃをクリックし直そう。トイPC は起動の「HELLO」が終わるまでキーが効かない。":`If you touch it while off, the POWER button flashes to tell you. In the studio the keyboard goes to the toy you clicked (green frame). After clicking the sequencer, the keyboard belongs to the sequencer, so click the toy again. The toy PC ignores keys until its startup "HELLO" finishes.`,クラッシュから戻らない:`It won't come back from a crash`,"トイPC は RESET で CPU が止まるので、POWER で起動し直す。シーケンサーの CRASH は、その音符の長さが終わると自動で RESET → 再起動する。止まらないときは ■（停止）を押せば元に戻る。熱で暴れているだけなら、手を離すと冷める。":`RESET stops the toy PC's CPU, so start it with POWER. A sequencer CRASH resets and reboots automatically when its note ends. If it doesn't, press ■ (stop). If it is just running hot, let go and it cools down.`,"映像が映らない（TELEKEY）":`No picture (TELEKEY)`,"電源を入れないとブラウン管は点かない。カメラを許可しなかったときは TEST（テスト映像）になる。TAB で「音声なし」と出たら、共有の画面で「タブの音声も共有する」をオンにし忘れている。":`The CRT stays dark until you switch on. Without camera permission you get TEST (test video). If TAB says "no audio", you forgot to turn on "Also share tab audio" in the share dialog.`,"画面が真っ白・真っ黒になる":`The screen is all white / black`,"TELEKEY は WebGL2 を使う。モニターに「WebGL2 が使えません」と出たら、ブラウザの設定で「ハードウェア アクセラレーション」がオンか確かめるか、Chrome の新しい版で開こう。ページを読み込み直す（F5）のも効く。":`TELEKEY uses WebGL2. If the monitor says "WebGL2 is not available", check that "hardware acceleration" is on in your browser settings or try a recent Chrome. Reloading the page (F5) helps too.`,"作った曲はどこに保存される？":`Where are my songs saved?`,"このブラウザの中に自動で保存される（別のパソコンやブラウザには無い）。シーケンサーの「保存」で JSON ファイルにできる。「読込」で戻せる。":`Automatically inside this browser (not on other computers or browsers). "Save" in the sequencer makes a JSON file; "Load" brings it back.`,"同じ URL なのに違う曲になる":`The same URL gives a different song`,"自動作曲のプログラムが新しくなると、同じ設定でも曲が変わることがある。同じ版のページなら必ず同じ曲になる。":`When the auto-composer program is updated, the same settings can give a different song. On the same version of the page it is always the same.`,"スマホ・タブレットで使える？":`Does it work on phones and tablets?`,"画面は小さくなるが開ける。ただしこのアプリは PC のキーボードで弾くことを大事にしているので、PC の Chrome がいちばんのおすすめ。":`It opens, though small. But this app is built around playing with a PC keyboard, so Chrome on a PC is the best choice. (The PAKU-PAKU 16 sampler page is designed for phones.)`,"WAV は音のファイル、WebM は映像と音のファイル。":`WAV is an audio file, WebM is a video + audio file.`,魔改造:`Heavy mod`,"サーキットベンディングで、ボタンやツマミをたくさん後付けすること。":`Adding lots of buttons and knobs through circuit bending.`,"おもちゃや電子機器の回路を、わざとつなぎ変えたり部品を足したりして、設計者が思ってもみなかった音を出す遊び。このアプリは、それをパソコンの中でまねしたもの。":`Deliberately rewiring toys and electronics or adding parts to get sounds their designers never imagined. This app imitates that inside your computer.`,"機械が「バグった」ような音や映像の乱れ。わざと起こして楽しむ。":`Sound or picture breakups that look like a "bug". Here you cause them on purpose for fun.`,"熱（ストレス）":`Heat (stress)`,"やりすぎると上がる、見えない値。上がりすぎると勝手にグリッチが暴れる（暴発）。手を離すと冷める。":`An invisible value that rises when you overdo it. Too high and glitches run wild by themselves (runaway). Let go to cool down.`,"ゆっくり揺れる波（Low Frequency Oscillator）。音程や強さを自動でうねらせる。":`A slowly swinging wave (Low Frequency Oscillator). It wobbles pitch or strength automatically.`,ループ:`Loop`,"音の一部をつかんで繰り返すこと。":`Grabbing part of a sound and repeating it.`,"ビットクラッシュ（CRUSH）":`Bit crush (CRUSH)`,"音の細かさ（ビット数や速さ）を落として、ガサガサの昔のゲームみたいな音にすること。":`Lowering the resolution (bits and rate) for a gritty old-video-game sound.`,"ディストーション（DIST）":`Distortion (DIST)`,"音をわざと歪ませること。":`Deliberately distorting the sound.`,フィードバック:`Feedback`,"出た音（映像）をもう一度入れること。こだまやハウリング、暴走のもと。":`Feeding the output (sound or picture) back in. The source of echoes, howling and runaways.`,"電圧 Starve":`Voltage starve`,"わざと電気を足りなくすること。音が遅く・低く・よれて、最後は止まる。":`Deliberately starving it of power. The sound gets slow, low and wobbly, and finally stops.`,シーケンサー:`Sequencer`,"演奏の操作（どのキーをいつ押したか・ツマミをどう回したか）を記録して、自動で弾かせる仕組み。":`Records your playing (which keys when, how the knobs moved) and plays it back automatically.`,オーバーダブ:`Overdub`,"録音した上に、さらに重ねて録音すること。":`Recording more on top of what you already recorded.`,オートメーション:`Automation`,"ツマミの動きを記録して、自動で動かすこと。シーケンサーでは ◠ ノブ の行。":`Recording knob moves and replaying them. In the sequencer: the ◠ knob rows.`,シード:`Seed`,"乱数の「種」。同じシードなら同じ乱数の並びになるので、同じ曲・同じグリッチが作れる。":`The "seed" of the random numbers. The same seed gives the same random sequence, so you get the same song and glitches.`,セクション:`Section`,"曲の区切り（イントロ・Aメロ・サビなど）。":`A part of a song (intro, verse, chorus...).`,モチーフ:`Motif`,"曲の中で繰り返す短いフレーズ。自動作曲は 2 小節のモチーフを少しずつ変えて繰り返す。":`A short phrase repeated in a song. The auto-composer repeats a 2-bar motif with small changes.`,"1 分間の拍の数。曲の速さ。":`Beats per minute: the speed of a song.`,"電子楽器をつなぐ決まり。キーボードやシーケンサーのデータを送り合える。":`The standard for connecting electronic instruments. Keyboards and sequencers send each other data.`,ブラウン管:`CRT`,"昔のテレビの画面。TELEKEY の画面は、それらしく丸く・にじんで見えるようにしてある。":`An old TV screen. TELEKEY's screen is made to look rounded and blurry like one.`,"動画の中の決まった位置。キーを押すとそこへ飛ぶ。":`A fixed point in a video. Press a key to jump there.`,"グリッチの種類を切り替えるツマミ。同じボタンでも BASE が変わると別のグリッチになる。":`The knob that switches glitch families. The same button gives a different glitch when BASE changes.`,"シーケンサーの CRASH の間、音が張り付いて止まり、画面が固まること。終わると RESET → 再起動する。":`During a sequencer CRASH the sound sticks and the screen freezes. Afterwards it RESETs and reboots.`,ドラムのロール:`Drum roll`,"音量。":`Volume.`,"💡 {0}":`💡 {0}`,"👉 {0}":`👉 {0}`,"Q. {0}":`Q. {0}`,"A. {0}":`A. {0}`,"★ {0}":`★ {0}`,"BASE {0}":`BASE {0}`,"。":`.`,"まねっこ（カバー）編":`Copycat (cover) section`,"聞いた曲を、おもちゃでまねしろ！":`Copy any song with your toys!`,"インコの形のカセットレコーダー（オリジナル設計）に、モニターとツマミの板をねじ止めした魔改造機。取り込んだ曲を聞いて、テンポ・コード・メロディ・ドラム・構成を読み取り、選んだおもちゃだけで同じ曲を弾き直す（カバー）。元の歌を取り出して重ねることもできる！":`A parrot-shaped cassette recorder (original design) with a monitor and a knob plate bolted on. It listens to a song you load, reads the tempo, chords, melody, drums and structure, and replays the same song using only the toys you pick (a cover). It can also pull out the original vocal and layer it on top!`,"頭の下の赤いボタン（「RESET」の札）":`The red button under the head (the "RESET" tag)`,"押すと再起動。テープが回り出す「カチャ・ウィーン」。":`Press to reboot. The tape starts with a "clack, whirr".`,"曲名・BPM・調・小節数・長さ・構成（色の帯）・小節ごとの大きさ・今から 8 小節のコードとメロディ。白い枠が使う範囲、光る線が再生位置。解析中は進み具合。":`Title, BPM, key, bar count, length, structure (colored strip), loudness per bar, and the chords and melody for the next 8 bars. The white frame is the range in use; the glowing line is the play position. Shows progress while analyzing.`,"取り出した歌・伴奏（カラオケ）・元の曲の大きさ。":`Levels of the extracted vocal, the backing (karaoke) and the original song.`,"KARAOKE を上げて VOCAL を下げると、元の伴奏でおもちゃが歌う":`Raise KARAOKE and lower VOCAL, and the toys sing over the original backing`,"テープのよれ・カセットのこもりと歪み・付点 8 分のテープエコー。":`Tape wobble, cassette muffle and grit, and a dotted-eighth tape echo.`,"カバーの壊れ度（グリッチ・歪みの量）。いっぱいに上げると、ブレイクでクラッシュすることも。":`How broken the cover gets (glitches and distortion). Turned all the way up, it may crash in the break.`,"カバーを弾くおもちゃ（いくつでも）。光っているおもちゃが弾く。":`The toys that play the cover (any number). Lit toys play.`,"カバーの雰囲気。どの楽器・どんな刻み方で弾くかが変わる（テンポ・コード・メロディは元の曲のまま）。":`The feel of the cover. Changes which instruments and rhythms are used (tempo, chords and melody stay as in the original).`,"使う範囲（小節）。サビだけ・イントロだけのカバーもできる。":`The range to use (bars). You can cover just the chorus or just the intro.`,"カバーに元の歌（取り出したボーカル）を重ねる。元の曲のテンポの揺れをならして、カバーの拍にそろえる。":`Layers the original singing (the extracted vocal) on the cover, evening out the original tempo wobble to match the cover beat.`,カセットの窓:`Cassette window`,"テープが鳴っている間、リールが回る。ラベルは曲名。":`The reels spin while the tape plays. The label shows the title.`,"曲のファイル（MP3・AAC・M4A・WAV など）を入れる。本体に落としても OK。解析とボーカル分離は、このブラウザの中だけで行う。":`Load a song file (MP3, AAC, M4A, WAV and so on). Dropping it on the body works too. Analysis and vocal separation happen only inside this browser.`,"押している間、元の曲を鳴らす（カバーと聞きくらべ）。":`Plays the original song while held (to compare with the cover).`,"押している間、テープが同じ所（1/8 拍）をくり返す。":`While held, the tape repeats the same spot (1/8 beat).`,"カバーを作ってシーケンサーに入れ、頭から鳴らす。押すたびに少し違うカバー。":`Makes the cover, puts it in the sequencer and plays it from the top. A slightly different cover every press.`,"MANEKKO MK-8 で、聞いた曲をおもちゃでまねしろ！":`Copy any song with your toys on the MANEKKO MK-8!`,"ラック・スタジオの 8 台目":`Toy 8 in the rack and studio,`,"は、取り込んだ曲を聞いて、選んだおもちゃだけで同じ曲を弾き直す（":`listens to a song you load and replays it using only the toys you pick (a`,カバー:`cover`,"）。元の歌を取り出して重ねることもできる。曲のファイルは":`). It can also pull out the original vocal and layer it on top. The song file is processed`,このブラウザの中だけ:`only inside this browser`,"で処理して、どこにも送らない。":`and never sent anywhere.`,カバーができるまで:`How a cover is made`,入れる:`Load`,"：⏏ LOAD（または本体に落とす）。MP3・AAC・M4A・WAV など":`: ⏏ LOAD (or drop it on the body). MP3, AAC, M4A, WAV and so on`,聞き取る:`Listen`,"：数秒から十数秒で、モニターにテンポ・調・構成・コード・メロディが出る":`: in a few seconds to a few dozen, the monitor shows the tempo, key, structure, chords and melody`,選ぶ:`Choose`,"：PLAY BY（弾くおもちゃ）・STYLE・FROM / TO（範囲）・VOCAL ON":`: PLAY BY (the toys that play), STYLE, FROM / TO (range), VOCAL ON`,"：シーケンサーに入って、頭から鳴る。押すたびに少し違うカバー":`: it goes into the sequencer and plays from the top. A slightly different cover every press`,"くらべる・直す":`Compare and fix`,"：▶ 原曲で聞きくらべ。シーケンサーで手直しして、WAV に書き出し":`: compare with ▶ ORIGINAL. Touch it up in the sequencer and export a WAV`,"COVER! を押したところ（PIKOTONE とサンプラーでカバー。下のシーケンサーにカバーが入る）":`After pressing COVER! (a cover with PIKOTONE and the sampler; the cover lands in the sequencer below)`,"何を聞き取るの？":`What does it listen for?`,聞き取るもの:`What it hears`,"どう使う？":`How it is used`,"テンポと拍・小節の頭":`Tempo, beats and bar starts`,"カバーのテンポ。元の曲の拍の揺れも測るので、取り出した歌をカバーの拍にぴったりそろえられる":`The cover tempo. It also measures the wobble of the original beats, so the extracted vocal lines up exactly with the cover beat`,調:`Key`,"おもちゃはハ長調（白鍵）で考えるので、曲をハ長調（短調ならイ短調）に移して弾く":`The toys think in C major (white   <h3>PAKU-PAKU 16 の使い方</h3>
  <table>

    <tr><td>RESAMPLE</td><td>RESAMPLE → 録るパッドを押す → ほかのパッドを鳴らす → RESAMPLE で止める（自分の音を録る）</td></tr>
    <tr><td>📂 FILE / COPY / DEL</td><td>音のファイルを入れる（PC はパッドに落としても）／COPY → 貼り付け先／DEL → 消すパッド</td></tr>
    <tr><td colspan="2"><b>PLAY タブ</b></td></tr>

    <tr><td>SUB PAD</td><td>最後に鳴らしたパッドをもう一度（ロール中は連打）</td></tr>
    <tr><td>16 LEVELS</td><td>いまのパッドの音を 16 パッドに並べる：PITCH（半音ずつ、9 が元の高さ）・VEL・CUTOFF・ATTACK・START</td></tr>
    <tr><td>TEMPO・TAP</td><td>テンポ（ロール・テンポ合わせ・パターンの速さ）。TAP を何回か押すとその速さに</td></tr>
    <tr><td colspan="2"><b>EDIT タブ</b></td></tr>

    <tr><td>✂ CHOP</td><td>音を切り分けて、からっぽのバンクのパッドに並べる：等分・音の立ち上がりで自動・手で印を付ける</td></tr>
    <tr><td>⏱ TEMPO FIT</td><td>音の BPM を推定して、TEMPO に合わせる（音程そのまま＝ストレッチ／速さだけ＝ピッチで）</td></tr>
    <tr><td>NORMALIZE ほか</td><td>音量をそろえる・逆向きにして保存・START〜END だけ残す・UNDO で 1 回戻す</td></tr>
    <tr><td colspan="2"><b>FX タブ</b></td></tr>
    <tr><td>BUS 1 / BUS 2 / MASTER</td><td>エフェクトの置き場所。パッドごとに送り先（DRY・BUS 1・BUS 2）を選ぶ。MASTER は全部の音に掛かる。◀ ▶ で 24 種類から選んで FX ON、ノブ 4 つで調整</td></tr>

    <tr><td colspan="2"><b>PATTERN タブ</b></td></tr>
    <tr><td>▶ PLAY / ● REC</td><td>いまのパターンをくり返し鳴らす／叩いた音を録音（重ね録り、QUANT でそろえる）。METRO はクリック、↶ で 1 つ戻す</td></tr>
    <tr><td>PATTERN</td><td>押してから、パッドで P01〜P16 を選ぶ（再生中は、いまのパターンの終わりで替わる）。小節は 1〜8、CLEAR で全部消す</td></tr>
    <tr><td>STEP</td><td>選んでいたパッドの音を、16 分のマス（パッド = ステップ、左上が 1）で置く／消す。◀ ▶ で小節</td></tr>
    <tr><td>ERASE</td><td>点けてからパッドを押すと、そのパッドの音がパターンから全部消える</td></tr>
    <tr><td>SWING</td><td>ノブ（SEQ ページ）。16 分の裏を遅らせて跳ねさせる（50〜75%）</td></tr>
    <tr><td colspan="2"><b>SONG タブ</b></td></tr>
    <tr><td>＋ / 削除 / × ± / ▶ SONG</td><td>いまのパターンを、選んだ所の後ろにつなぐ・くり返し回数・ソングを鳴らす</td></tr>
    <tr><td>→ STUDIO</td><td>ソング（無ければいまのパターン）をスタジオのシーケンサーに入れて開く。スタジオではほかのおもちゃといっしょに鳴らせる（強さは各パッドの設定どおり）</td></tr>

    <tr><td>PC のキー</td><td>Z X C V・A S D F・Q W E R・1 2 3 4 がパッド（下の段から）。スペースで STOP</td></tr>
    <tr><td>MIDI</td><td>上の MIDI を押すと、MIDI 機器のノート 36〜51 でパッド 1〜16</td></tr>
  </table>
