<h3>BLIPPY BOOK 30 のキー操作</h3>
<p><b>まず左上の大きな緑の POWER ボタンで電源を入れよう</b>（電源 OFF のときは Enter キーでも入る）。RESET を押すと CPU が止まるので、もう一度 POWER。</p>
<table>
  <tr><td>A〜Z</td><td>文字キー</td></tr>
  <tr><td>1〜0</td><td>ドレミの数字キー</td></tr>
  <tr><td>- ^ @ [</td><td>♪ ? ★ OK</td></tr>
  <tr><td>, . / ; :</td><td>GLITCH 1〜5（押している間）</td></tr>
  <tr><td>↑ ↓</td><td>BASE（グリッチの種類）</td></tr>
  <tr><td>← →</td><td>MODE</td></tr>
  <tr><td>Space</td><td>LOOP HOLD</td></tr>
  <tr><td>Enter</td><td>LOOP RELEASE</td></tr>
  <tr><td>Tab</td><td>LOOP スイッチ（上→中→下）</td></tr>
  <tr><td>Backspace</td><td>STRETCH スイッチ</td></tr>
  <tr><td>PageUp / PageDown</td><td>電源 ON / OFF</td></tr>
  <tr><td>Esc</td><td>RESET</td></tr>

<h3>TELEKEY TK-6：映像＋音のグリッチ・マシン</h3>
<table>
  <tr><td>入力</td><td>モニターの下で TAB / FILE / CAM / TEST を選ぶ（最初は Web カメラ。使えなければテスト映像）</td></tr>
  <tr><td>Q〜［ ・ A〜］</td><td>押している間だけ効くグリッチ（映像＋音が同時に壊れる。キーの下に映像／音の名前）</td></tr>
  <tr><td>Z〜＼</td><td>音を足す楽器キー（ビープ・ノイズ・ドラム・ドローンなど。音階つき）</td></tr>
  <tr><td>Space</td><td>FREEZE（押している間、今の映像と音をつかんで繰り返す）</td></tr>
  <tr><td>1〜0</td><td>キューポイント（最初は 10%〜90%・0%）。Shift＋数字で今の位置を登録</td></tr>
  <tr><td>- ^ ¥</td><td>再生を遅く / 速く / 元の速さ（ファイル・テスト映像）</td></tr>
  <tr><td>↑ ↓</td><td>音のピッチ ±半音（取り込んだ音）</td></tr>
  <tr><td>← →</td><td>5 秒戻る / 進む</td></tr>
  <tr><td>BS</td><td>RELEASE（効いているグリッチを全部止める）</td></tr>
  <tr><td>Home</td><td>再生 / 一時停止</td></tr>
  <tr><td>POWER</td><td>モニターの右下の大きな緑のボタン（押すたびに ON / OFF）。電源 OFF のときは Enter でも入る</td></tr>
  <tr><td>PgUp / PgDn</td><td>電源 ON / OFF</td></tr>
  <tr><td>F1〜F5</td><td>GLITCH ボタン：今の BASE の一発グリッチ（左パネルに名前）</td></tr>
  <tr><td>F6〜F10</td><td>BASE 1〜5（TAPE / DIGITAL / SIGNAL / BEEP / MELTDOWN）</td></tr>
  <tr><td>Enter / BS</td><td>HOLD（今効いているグリッチをつかんで離しても続ける）/ RELEASE（全部解除）</td></tr>
  <tr><td>F11 / F12 / Tab</td><td>LFO の行き先 / キー混線 / 歪みの種類</td></tr>
  <tr><td>Esc</td><td>RESET（全部止めて、ピッチも元に戻す）</td></tr>
</table>
<p>右のパネル：GLITCH AMT（グリッチの強さ）・LFO（映像／音／両方をうねらせる）・FEEDBACK（映像も音も自分に返る）・DIST（CLIP／CRUSH）・SPEED/PITCH・DRY/WET・MASTER。
CROSSTALK を ON にすると、キーが混線して隣のキーも効いたり、押すたびに別の効果になったりします。</p>
<p>● REC VIDEO（モニター左上）：加工後の映像と音を録画して WebM で保存。音だけなら上のバーの REC（WAV）。</p>
<p>HEAT の LED：やりすぎると機械が熱くなり、勝手にグリッチ・砂嵐・音の張り付きが起きます（固まりません）。手を離せば冷めます。Esc（RESET）ですぐ冷やせます。</p>
<p>他人の著作物（動画・音楽）を加工・録画・公開するときは、権利者の許可を得てください。</p>
<p>TAB モード：「TAB を取り込む」→ Chrome の画面で「タブ」を選び、動画を再生しているタブを選択 →「タブの音声も共有する」にチェック →「共有」。
取り込んだタブの音は、こちらで加工した音だけが聞こえるように自動で止まります。</p>

<h3>TYPOTRON TT-109：キーボードそのものが楽器</h3>
<table>
  <tr><td>Z 段 / A 段 / Q 段 / 数字段</td><td>音階（下の段ほど低い。1 段上がると約 4 度上）</td></tr>
  <tr><td>Space</td><td>SUSTAIN（押している間、音が伸びる）</td></tr>
  <tr><td>左 Shift / 右 Shift</td><td>押している間 1 オクターブ下 / 上</td></tr>
  <tr><td>Enter</td><td>打った音の「行」をループ再生（もう一度で止める）</td></tr>
  <tr><td>BS / Esc</td><td>行の最後の 1 文字を消す / 行を全部消す</td></tr>
  <tr><td>Ins</td><td>上書きモード（ループ中に打つと、今鳴っている所を書き換える）</td></tr>
  <tr><td>Del</td><td>CORRUPT（押している間、音が壊れる）</td></tr>
  <tr><td>Tab</td><td>STUTTER（押している間、同じ所を繰り返す）</td></tr>
  <tr><td>Caps</td><td>LATCH（押した音が離しても鳴りっぱなし。もう一度押すと止まる）</td></tr>
  <tr><td>← →</td><td>ピッチベンド（押している間）</td></tr>
  <tr><td>↑ ↓</td><td>移調（音階 1 つ分ずつ）</td></tr>
  <tr><td>Home / End</td><td>テンポ + / −</td></tr>
  <tr><td>F1〜F4</td><td>波形 PULSE / SAW / BELL / NOISE</td></tr>
  <tr><td>F5〜F8</td><td>音階 MAJOR / MINOR / PENTA / BENT</td></tr>
  <tr><td>F9〜F12</td><td>キーボードの故障：GHOST / SCAN / BOUNCE / OVERFLOW（ON/OFF）</td></tr>
  <tr><td>テンキー・無変換・変換・かな</td><td>ドラム</td></tr>
  <tr><td>POWER</td><td>キーボード左上の大きな緑の POWER ボタン（押すたびに ON / OFF）。電源 OFF のときは Enter キーでも入る</td></tr>
  <tr><td>PgUp / PgDn</td><td>電源 ON / OFF</td></tr>
</table>
<p>F6・F7・F11・F12 などはブラウザによっては先に取られてしまうことがあります。そのときは画面のキーをクリックしてください。</p>

<h3>VROOMBOX VR-5 のキー操作</h3>
<table>
