  <body>
    <div id="stage">
      <div class="toy" id="toy">
        <!-- ふた（液晶側） -->
        <div class="lid">
          <div class="lid-panel">
            <div class="brand-strip"><span class="b1">BLIPPY</span> <span class="b2">BOOK</span> <span class="b3">30</span></div>
            <div class="mode-legend left" id="legendL"></div>
            <div class="mode-legend right" id="legendR"></div>
            <div class="lcd-surround">
              <div class="lcd-wrap">
                <canvas id="lcd"></canvas>
                <div class="lcd-glare"></div>
              </div>
            </div>
            <div class="tape lid-tape">CIRCUIT BENT</div>
            <div class="lid-art" id="lidArt"></div>
          </div>
        </div>
        <div class="hinge">
          <div class="hinge-block left"></div>
          <div class="hinge-roll"></div>
          <div class="hinge-block right"></div>
        </div>
        <!-- 本体（キーボード側）。改造パーツは main.ts で配置する -->
        <div class="base" id="base">
          <div class="keys-panel" id="keysPanel"></div>
          <div class="number-row" id="numberRow"></div>
          <div class="mode-area">
            <div class="mode-dial" id="modeDial"><div class="cap"><i></i></div></div>
            <div class="mode-pills" id="modePills"></div>
          </div>
        </div>
      </div>
    </div>
    <button id="helpBtn" title="キー操作">?</button>
    <div id="help" hidden>
      <h3>PCキーボード</h3>
      <table>
        <tr><td>A〜Z</td><td>文字キー</td></tr>
        <tr><td>1〜0</td><td>ドレミの数字キー</td></tr>
        <tr><td>- ^ @ [</td><td>♪ ? ★ OK</td></tr>
        <tr><td>, . / ; :</td><td>GLITCH 1〜5（押している間）</td></tr>
        <tr><td>↑ ↓</td><td>BASE（グリッチの種類）</td></tr>
        <tr><td>← →</td><td>MODE</td></tr>
        <tr><td>Space</td><td>LOOP HOLD</td></tr>
        <tr><td>Enter</td><td>LOOP RELEASE</td></tr>
        <tr><td>Tab</td><td>LOOP スイッチ（上→中→下）</td></tr>
        <tr><td>Backspace</td><td>STRETCH スイッチ</td></tr>
        <tr><td>PageUp / PageDown</td><td>電源 ON / OFF</td></tr>
        <tr><td>Esc</td><td>RESET</td></tr>
      </table>
      <p>ノブ：上下にドラッグ（Shift で細かく）、ホイール、ダブルクリックで初期値</p>
    </div>
  </body>
</html>
